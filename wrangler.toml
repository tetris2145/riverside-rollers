name = "riverside-rollers"
pages_build_output_dir = "public"
compatibility_date = "2024-11-01"

# Created by "wrangler kv namespace create riverside-rollers-kv" — paste the
# id it gives you here before deploying. See README.md step 4.
[[kv_namespaces]]
binding = "LEAGUE_KV"
id = "PASTE_YOUR_KV_NAMESPACE_ID_HERE"

# Created by "wrangler r2 bucket create riverside-rollers-media" — the name
# below must match exactly what you create in step 5 of README.md.
[[r2_buckets]]
binding = "LEAGUE_R2"
bucket_name = "riverside-rollers-media"
