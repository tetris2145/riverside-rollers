function cD(){

 S.d.teams.forEach(t=>{T[t.id]={id:t.id,name:t.name,out:t.out,pts:0,games:0,pins:0,hp:0,hg:0,hgh:0,hs:0,hsh:0,pl:t.players};t.players.forEach(p=>P[p.id]={id:p.id,name:p.name,team:t.name,tout:t.out,pout:p.out,games:0,pins:0,hg:0,hgh:0,hs:0,hsh:0,lh:0})});
 Object.keys(S.d.scores).map(Number).sort((a,b)=>a-b).forEach(w=>{
  const ents=[];
  for(const tid in S.d.scores[w]){const s=S.d.scores[w][tid];if(!T[tid]||s.bye)continue;
   const ps=Object.keys(s.p||{}).filter(pid=>P[pid]).map(pid=>{const r=s.p[pid],h=cl(r.h);return{id:pid,g:r.g,h,ser:r.g[0]+r.g[1]+r.g[2]}});

   e.ser=e.g[0]+e.g[1]+e.g[2];e.hser=e.hg[0]+e.hg[1]+e.hg[2];ents.push(e)}
  const by=Object.fromEntries(ents.filter(e=>!T[e.id].out).map(e=>[e.id,e]));
  ents.forEach(e=>{const o=by[e.opp];if(o&&by[e.id]){for(let i=0;i<3;i++)e.pts+=c3(e.hg[i],o.hg[i]);e.pts+=2*c3(e.hser,o.hser)}});
  W[w]=ents;
  ents.forEach(e=>{const t=T[e.id],vd=!!(e.opp&&T[e.opp]&&T[e.opp].out);
   if(!t.out&&!vd){t.pts+=e.pts;t.games+=3;t.pins+=e.ser;t.hp+=e.hser}

 return{T,P,W};
}

 else if(x=="addp"){const i=$("np-"+d.tid),v=i&&i.value.trim();if(v){T(d.tid).players.push({id:"d"+Date.now(),name:v});save();render()}}
 else if(x=="edt"){dEdit=d.tid?"t:"+d.tid:"p:"+d.pid;dDelT=null;render();const i=$("rnd");if(i)i.focus()}
 else if(x=="ren"){const v=$("rnd").value.trim(),o=d.pid?PL(d.pid):T(d.tid);if(o&&v)o.name=v;dEdit=null;save();render()}
 else if(x=="no"){dEdit=null;dDelT=null;dDelW=0;mDel=null;render()}
 else if(x=="delt"){dDelT=d.tid;dEdit=null;render()}
 else if(x=="delt2"){const t=T(d.tid);if(t)t.out=true;dDelT=null;save();render()}
 else if(x=="delp"){const t=S.d.teams.find(t=>t.players.some(p=>p.id==d.pid));if(t){if(hasHist(d.pid))t.players.find(p=>p.id==d.pid).out=true;else t.players=t.players.filter(p=>p.id!=d.pid)}save();render()}
 else if(x=="wkp"){S.d.weeks=Math.min(52,WD()+1);save();render()}
 else if(x=="wkm"){const used=Object.keys(S.d.scores).filter(w=>Object.keys(S.d.scores[w]||{}).length).map(Number);S.d.weeks=Math.max(1,Math.max(0,...used),WD()-1);if(dwk>S.d.weeks)dwk=S.d.weeks;save();render()}
 else if(x=="dw"){dDelW=dSelW;render()}
 else if(x=="dw2"){const n=dDelW,o={};Object.keys(S.d.scores).forEach(s=>{const k=+s;if(k<n)o[k]=S.d.scores[s];else if(k>n)o[k-1]=S.d.scores[s]});S.d.scores=o;const used=Object.keys(o).filter(k=>Object.keys(o[k]||{}).length).map(Number);S.d.weeks=Math.max(1,Math.max(0,...used),WD()-1);if(dwk>S.d.weeks)dwk=S.d.weeks;dDelW=0;ED=null;save();render()}
 else if(x=="demo"){demoD();ED=null;dtab="Standings";save();render()}
 else if(x=="nsd"){if(ndsAsk)newSeasonD();else{ndsAsk=true;render()}}
 else if(x=="cad"){if(cadAsk)clearAllD();else{cadAsk=true;render()}}

 else if(x=="save")saveD();
 else if(x=="clr"){const old=S.d.scores[dwk]||{},o={};S.d.teams.forEach(t=>{if(t.out&&old[t.id])o[t.id]=old[t.id]});S.d.scores[dwk]=o;dflash="Week "+dwk+" cleared";edSig="";save();render()}
 else if(x=="ovr"){dovr=!dovr;render()}
 else if(x=="up")upM(d.ml);
 else if(x=="mdel"){mDel=d.mid;render()}
 else if(x=="mdel2"){const id=d.mid;mDel=null;S.media=S.media.filter(m=>m.id!=id);save();render();(async()=>{try{const a=await window.claude.use("assets");if(a)await a.delete(id)}catch(e){}})()}
});
document.addEventListener("change",e=>{const t=e.target,ds=t.dataset;
 if(ds&&ds.dopp&&ED){setOppD(ds.dopp,t.value);render()}
 else if(t.id=="dwk"){dwk=+t.value;dflash="";render()}
 else if(t.id=="ddw"){dSelW=+t.value}});
document.addEventListener("input",e=>{const t=e.target,ds=t.dataset;if(LG!="d"||!ds||!ED)return;
 if(ds.dp){const[tid,pid,i]=ds.dp.split("|");ED[tid].p[pid].g[+i]=t.value;updD(tid);const o=ED[tid].opp;if(o&&ED[o])updD(o)}
 else if(ds.dh){const[tid,pid]=ds.dh.split("|");if(!pc(tid,pid).man)ED[tid].p[pid].ho=1;ED[tid].p[pid].h=t.value;updD(tid);const o=ED[tid].opp;if(o&&ED[o])updD(o)}});
document.addEventListener("keydown",e=>{if(e.key!="Enter")return;const id=e.target.id||"";if(id=="tn"){const b=document.querySelector('[data-dx="addt"]');b&&b.click()}else if(id.startsWith("np-")){const b=document.querySelector('[data-dx="addp"][data-tid="'+id.slice(3)+'"]');b&&b.click()}else if(id=="rnd"&&LG=="d"){const b=document.querySelector('[data-dx="ren"]');b&&b.click()}});


const RC=["#ff8fb8","#ffb86b","#ffe066","#7ee0a8","#6cc4ff","#b39bff"];document.querySelectorAll(".rb").forEach(el=>{let n=0;el.innerHTML=[...el.textContent].map(c=>c==" "?" ":`<span style="color:${RC[n++%6]}">${c}</span>`).join("")});
function lbClose(){const o=$("lb");if(o)o.remove();document.body.style.overflow=""}
function lbOpen(src,cap){lbClose();const o=document.createElement("div");o.id="lb";o.innerHTML=`<button class="lbx" aria-label="Close">✕</button><img src="${src}" alt=""><div class="lbc">${cap}</div>`;o.onclick=lbClose;document.body.appendChild(o);document.body.style.overflow="hidden"}
document.addEventListener("click",e=>{if(e.target.id=="bo"){S.blackout=!S.blackout;save();render()}});
document.addEventListener("click",e=>{const im=e.target.closest(".mi img");if(im){const c=im.parentNode.querySelector(".mcap");lbOpen(im.getAttribute("src"),c?c.innerHTML:"")}});

setTimeout(initDb,0);setTimeout(initRoom,0);
render();
/* ---- make-up games (singles) ---- */
function schedPlayedS(a,b){for(const k in S.scores){const e=S.scores[k][a],o=S.scores[k][b];if(e&&o&&e.g&&o.g&&e.opp==b&&o.opp==a)return k}return null}
function outstandingS(){const out=[];for(const w in S.sched)(S.sched[w]||[]).forEach(([a,b])=>{const pa=S.players.find(p=>p.id==a),pb=S.players.find(p=>p.id==b);if(!pa||!pb)return;if(!schedPlayedS(a,b))out.push({w:+w,a,b})});return out.sort((x,y)=>x.w-y.w)}
function roundRobin(ids){let arr=ids.slice();if(arr.length%2)arr.push(null);const n=arr.length,rounds=[];for(let r=0;r<n-1;r++){const round=[];for(let i=0;i<n/2;i++){const a=arr[i],b=arr[n-1-i];if(a!=null&&b!=null)round.push([a,b])}rounds.push(round);arr.splice(1,0,arr.pop())}return rounds}
function genSchedS(){const ids=S.players.filter(p=>!p.out).map(p=>p.id);if(ids.length<2)return;const rounds=roundRobin(ids);S.sched={};for(let w=1;w<=WK();w++)S.sched[w]=rounds[(w-1)%rounds.length].map(x=>x.slice());save();render()}
function mkRow(w,a,b,nameOf,delKey){return`<div class="pl2"><span class="rnm">Week ${w}: ${esc(nameOf(a))} vs ${esc(nameOf(b))}</span>${CAN?`<button class="ib red" data-mkdel="${delKey}" title="Remove fixture">${BIN}</button>`:""}</div>`}
function makeup(){const nameOf=id=>{const p=S.players.find(x=>x.id==id);return p?p.name:"?"};
 const out=outstandingS(),allF=[];for(const w in S.sched)(S.sched[w]||[]).forEach(([a,b])=>allF.push({w:+w,a,b}));
 const hasSched=Object.values(S.sched).some(a=>a&&a.length);
 const gen=CAN?`<div class="card"><h3 class="sh">${hasSched?"Season schedule":"Set up the season schedule"}</h3><p class="sub">${hasSched?"Every bowler plays every other bowler in turn. Regenerating replaces all fixtures below (played results are unaffected).":"Generate the whole season\u2019s pairings in one go \u2014 everyone plays everyone in turn, spread across the weeks. After this, a bowler who doesn\u2019t play their scheduled week shows up here automatically."}</p><div class="bar"><button class="btn pri" data-mkgen="1">\ud83d\udd00 ${hasSched?"Regenerate full-season schedule":"Generate full-season schedule"}</button></div></div>`:"";
 const add=CAN?`<div class="card"><h3 class="sh">Add or adjust a single fixture</h3><p class="sub">For a one-off swap, rematch or a bowler joining partway through.</p><div class="bar"><select id="mkw">${Array.from({length:WK()},(_,i)=>`<option value="${i+1}">Week ${i+1}</option>`).join("")}</select><select id="mka">${S.players.filter(p=>!p.out).map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join("")}</select><span>vs</span><select id="mkb">${S.players.filter(p=>!p.out).map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join("")}</select><button class="btn pri" data-mkadd="1">Add fixture</button></div></div>`:"";
 return`<div class="hd"><div><h2>Make-up Games</h2><p>Scheduled fixtures that haven\u2019t been bowled yet.</p></div></div>${gen}`
 +(out.length?`<div class="card"><h3 class="sh">\u23f3 Outstanding (${out.length})</h3>${out.map(f=>mkRow(f.w,f.a,f.b,nameOf,f.w+"|"+f.a+"|"+f.b)).join("")}</div>`:`<div class="card empty">No outstanding fixtures \u2014 everyone\u2019s up to date.</div>`)
 +add
 +(allF.length?`<div class="card"><h3 class="sh">All scheduled fixtures</h3>${allF.sort((x,y)=>x.w-y.w).map(f=>{const played=schedPlayedS(f.a,f.b);return`<div class="pl2"><span class="rnm">Week ${f.w}: ${esc(nameOf(f.a))} vs ${esc(nameOf(f.b))}${played?` <small style="color:#0f7a4c">\u2713 played wk ${played}</small>`:""}</span>${CAN?`<button class="ib red" data-mkdel="${f.w}|${f.a}|${f.b}" title="Remove">${BIN}</button>`:""}</div>`}).join("")}</div>`:"");}
/* ---- make-up games (doubles) ---- */
function schedPlayedD(a,b){for(const k in S.d.scores){const e=S.d.scores[k][a],o=S.d.scores[k][b];if(e&&o&&e.p&&o.p&&e.opp==b&&o.opp==a)return k}return null}
function outstandingD(){const out=[];for(const w in S.d.sched)(S.d.sched[w]||[]).forEach(([a,b])=>{const ta=S.d.teams.find(t=>t.id==a),tb=S.d.teams.find(t=>t.id==b);if(!ta||!tb)return;if(!schedPlayedD(a,b))out.push({w:+w,a,b})});return out.sort((x,y)=>x.w-y.w)}
function genSchedD(){const ids=dAct().map(t=>t.id);if(ids.length<2)return;const rounds=roundRobin(ids);S.d.sched={};for(let w=1;w<=WD();w++)S.d.sched[w]=rounds[(w-1)%rounds.length].map(x=>x.slice());save();render()}
function dMakeup(){const nameOf=id=>{const t=S.d.teams.find(x=>x.id==id);return t?t.name:"?"};
 const out=outstandingD(),allF=[];for(const w in S.d.sched)(S.d.sched[w]||[]).forEach(([a,b])=>allF.push({w:+w,a,b}));
 const hasSched=Object.values(S.d.sched).some(a=>a&&a.length);
 const gen=CAN?`<div class="card"><h3 class="sh">${hasSched?"Season schedule":"Set up the season schedule"}</h3><p class="sub">${hasSched?"Every team plays every other team in turn. Regenerating replaces all fixtures below (played results are unaffected).":"Generate the whole season\u2019s pairings in one go \u2014 every team plays every other team in turn, spread across the weeks. After this, a team that doesn\u2019t play their scheduled week shows up here automatically."}</p><div class="bar"><button class="btn pri" data-mkdgen="1">\ud83d\udd00 ${hasSched?"Regenerate full-season schedule":"Generate full-season schedule"}</button></div></div>`:"";
 const add=CAN?`<div class="card"><h3 class="sh">Add or adjust a single fixture</h3><p class="sub">For a one-off swap, rematch or a team joining partway through.</p><div class="bar"><select id="mkdw">${Array.from({length:WD()},(_,i)=>`<option value="${i+1}">Week ${i+1}</option>`).join("")}</select><select id="mkda">${dAct().map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join("")}</select><span>vs</span><select id="mkdb">${dAct().map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join("")}</select><button class="btn pri" data-mkdadd="1">Add fixture</button></div></div>`:"";
 return`<div class="hd"><div><h2>Make-up Games</h2><p>Scheduled fixtures that haven\u2019t been bowled yet.</p></div></div>${gen}`
 +(out.length?`<div class="card"><h3 class="sh">\u23f3 Outstanding (${out.length})</h3>${out.map(f=>mkRow(f.w,f.a,f.b,nameOf,f.w+"|"+f.a+"|"+f.b)).join("")}</div>`:`<div class="card empty">No outstanding fixtures \u2014 all teams are up to date.</div>`)
 +add
 +(allF.length?`<div class="card"><h3 class="sh">All scheduled fixtures</h3>${allF.sort((x,y)=>x.w-y.w).map(f=>{const played=schedPlayedD(f.a,f.b);return`<div class="pl2"><span class="rnm">Week ${f.w}: ${esc(nameOf(f.a))} vs ${esc(nameOf(f.b))}${played?` <small style="color:#0f7a4c">\u2713 played wk ${played}</small>`:""}</span>${CAN?`<button class="ib red" data-mkddel="${f.w}|${f.a}|${f.b}" title="Remove">${BIN}</button>`:""}</div>`}).join("")}</div>`:"");}
document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const d=b.dataset;
 if(d.mkgen){genSchedS()}else if(d.mkdgen){genSchedD()}else if(d.mkadd){const w=+$("mkw").value,a=$("mka").value,bb=$("mkb").value;if(a&&bb&&a!=bb){S.sched[w]=S.sched[w]||[];if(!S.sched[w].some(([x,y])=>(x==a&&y==bb)||(x==bb&&y==a)))S.sched[w].push([a,bb]);save();render()}}
 else if(d.mkdel){const[w,a,bb]=d.mkdel.split("|");if(S.sched[w])S.sched[w]=S.sched[w].filter(([x,y])=>!((x==a&&y==bb)||(x==bb&&y==a)));save();render()}
 else if(d.mkdadd){const w=+$("mkdw").value,a=$("mkda").value,bb=$("mkdb").value;if(a&&bb&&a!=bb){S.d.sched[w]=S.d.sched[w]||[];if(!S.d.sched[w].some(([x,y])=>(x==a&&y==bb)||(x==bb&&y==a)))S.d.sched[w].push([a,bb]);save();render()}}
 else if(d.mkddel){const[w,a,bb]=d.mkddel.split("|");if(S.d.sched[w])S.d.sched[w]=S.d.sched[w].filter(([x,y])=>!((x==a&&y==bb)||(x==bb&&y==a)));save();render()}
});
